[project]
name = "acodet"
version = "0.1.0"
description = "Automatic detection of vocalizing animals in acoustic datasets."
readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = [
    "apache-beam",
    # "bacpipe",
    "einops",
    "flax",
    "gdown",
    "httpx",
    "importlib-resources",
    "kagglehub",
    "keras-cv",
    "librosa",
    "ml-collections",
    "numba",
    "onnxruntime-gpu",
    "panel",
    "plotly",
    "pysocks",
    "pytest",
    "seaborn",
    "sounddevice",
    "streamlit",
    "tensorflow; sys_platform != 'linux' and sys_platform != 'darwin'",
    "tensorflow[and-cuda]<2.21; sys_platform == 'linux'",  # GPU is only supported on Linux.
    "tensorflow<=2.19.1; sys_platform == 'darwin'",  # Apple has a custom TF plugin, but is broken in TF 2.20.
    "tensorflow-metal; sys_platform == 'darwin'",
    "tensorflow-hub",
    "tensorflow-io",
    "timm",
    "torch<2.11",
    "torchaudio<2.11",
    "torchcodec",
    "torchvision",
    "transformers",
    "umap-learn",
    "uvicorn",
    "uvloop; sys_platform != 'win32'",
    "zipp",
]

# NOTE: The two sections below are needed to specify a version of ONNX which is compatible with current versions of
#       Torch/Tensorflow, which use CUDA 12 (not CUDA 13).
[tool.uv.sources]
onnxruntime-gpu = { index = "ort-cuda-12" }

[[tool.uv.indexes]]
name = "ort-cuda-12"
url = "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/onnxruntime-cuda-12/pypi/simple/"

