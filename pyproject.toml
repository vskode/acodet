[project]
name = "acodet"
version = "0.1.0"
description = "Automatic detection of vocalizing animals in acoustic datasets."
readme = "README.md"
requires-python = ">=3.11, <3.12"
# bacpipe pins the whole stack acodet uses (tensorflow, keras, torch, torchaudio,
# numpy, pandas, librosa, scipy, scikit-learn, matplotlib, seaborn, plotly, timm,
# tqdm, pyyaml, pytest, ...), so only packages it doesn't provide are listed here.
dependencies = [
    "bacpipe==1.3.5",
    "gdown",
    "streamlit",
]
